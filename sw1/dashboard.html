<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logikhaus SoC Dashboard</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#1c2530;--muted:#5d6b7a;--line:#c9d1da;--acc:#0b6e6e;--ok:#1d7a3a;--err:#b3261e;--code:#f3f5f7}
@media (prefers-color-scheme:dark){:root{--bg:#151a20;--panel:#1e252d;--ink:#e6ebf0;--muted:#92a0ae;--line:#36414d;--acc:#4cc2c2;--ok:#5fcf80;--err:#ff8a80;--code:#161c22}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#172a3a;color:#fff;padding:12px 16px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.logo{height:44px;width:auto;background:#fff;border-radius:6px;padding:4px 8px;display:block}
h1{margin:0;font-size:1.2rem}
h2{margin:0 0 10px;font-size:1rem}
main{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
@media(max-width:480px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
section.wide{grid-column:1/-1}
.chip{display:inline-block;margin:0 6px 4px 0;padding:2px 10px;border-radius:12px;background:#364b5c;color:#fff;font-size:.85rem}
.chip.good{background:#1d7a3a}.chip.bad{background:#b3261e}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-top:10px}
label.f{display:grid;gap:2px;font-size:.8rem;color:var(--muted)}
input[type=text],input[type=number],select{padding:7px;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;width:130px}
input[type=range]{width:100%}
button{padding:8px 12px;font:inherit;font-weight:600;color:#fff;background:var(--acc);border:0;border-radius:6px;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#0b1a1a}}
button.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
button.red{background:var(--err);color:#fff}
button:disabled,input:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,#drop:focus-within{outline:3px solid var(--acc);outline-offset:2px}
#drop{display:block;margin-top:10px;border:2px dashed var(--line);border-radius:6px;padding:18px 10px;text-align:center;cursor:pointer;word-break:break-all}
#drop:hover,#drop.over{border-color:var(--acc)}
#drop input{position:absolute;opacity:0;width:1px;height:1px}
progress{width:100%;height:10px;margin-top:10px;accent-color:var(--acc)}
.st{margin-top:8px;min-height:1.4em;font-size:.88rem;color:var(--muted)}
.ok{color:var(--ok)}.err{color:var(--err)}
pre{margin:10px 0 0;padding:10px;background:var(--code);border:1px solid var(--line);border-radius:6px;overflow-x:auto;font:12.5px/1.45 ui-monospace,Consolas,monospace;min-height:2.5em}
#log{max-height:170px;overflow:auto}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.88rem}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:center}
canvas{display:block;margin-top:10px;width:100%;max-width:640px;background:#000;image-rendering:pixelated;border-radius:4px}
.radios label{margin-right:12px}
</style>
</head>

<main>

<section class="wide">
  <h2>1. Upload a file to DDR</h2>
  <div class="row">
    <label class="f">Target
      <select id="tgt">
        <option value="01000000">Weights 0x01000000</option>
        <option value="04800000">Padding 0x04800000</option>
        <option value="09000000">Image 0x09000000</option>
        <option value="">Custom address</option>
      </select></label>
    <label class="f">Address (hex, 0x01000000 or higher)<input type="text" id="addr" value="01000000" maxlength="10" readonly style="width:170px"></label>
    <label class="f" style="grid-auto-flow:column;align-items:center;gap:6px;font-size:.9rem;color:var(--ink)"><input type="checkbox" id="crc" checked> Verify CRC32</label>
  </div>
  <label id="drop"><input type="file" id="file"><span id="fname">Choose a file or drop it here</span></label>
  <div class="row"><button id="go" disabled>Upload to DDR</button></div>
  <progress id="bar" value="0" max="100" hidden></progress>
  <div class="st" id="ust" role="status" aria-live="polite"></div>
</section>

<section>
  <h2>2. AI</h2>
  <div class="row">
    <button id="runai">Run AI detection</button>
    <button id="clr" class="red">Clear box</button>
  </div>
</section>

<section>
  <h2>3. VPU</h2>
  <div class="radios">
    <label><input type="radio" name="vm" value="0" checked> Bypass</label>
    <label><input type="radio" name="vm" value="1"> Edge detect</label>
    <label><input type="radio" name="vm" value="2"> Sharpen</label>
  </div>
  <label class="f" style="margin-top:10px">Effect level: <span id="lvv">50</span> %<input type="range" id="lv" min="0" max="100" value="50" disabled></label>
  <h2 style="margin-top:14px">FPGA registers</h2>
  <div class="row">
    <label class="f">Address (hex)<input type="text" id="ra" value="21000000"></label>
    <label class="f">Words (1-16)<input type="number" id="rw" value="16" min="1" max="16" style="width:80px"></label>
    <button id="rr" class="alt">Read</button>
  </div>
  <pre id="regs">Press Read.</pre>
</section>

<section class="wide">
  <h2>4. Image snapshot (DDR 0x09000000, 416x256 FP16 RGBA)</h2>
  <div class="row"><button id="snap">Fetch snapshot</button></div>
  <div class="st" id="sst" role="status" aria-live="polite"></div>
  <canvas id="cv" width="416" height="256"></canvas>
</section>

<section class="wide">
  <h2>5. DDR memory</h2>
  <div class="row">
    <label class="f">Address (hex)<input type="text" id="ma" value="01000000"></label>
    <label class="f">Length (max 4096)<input type="number" id="ml" value="256" min="1" max="4096" step="16"></label>
    <button id="mshow">Show hex</button><button id="mprev" class="alt">Prev</button><button id="mnext" class="alt">Next</button>
  </div>
  <div class="row">
    <button class="alt" data-a="01000000">Weights</button><button class="alt" data-a="04800000">Padding</button><button class="alt" data-a="09000000">Image</button>
    <button class="alt" id="mdl">Download last upload</button>
  </div>
  <pre id="hex">Press "Show hex".</pre>
  <div class="st" id="mst" role="status" aria-live="polite"></div>
</section>

<section class="wide">
  <h2>Log</h2>
  <pre id="log"></pre>
</section>

</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var busy=false,last=null,file=null,MAXA=0x20000000;

function hex8(n){return('00000000'+(n>>>0).toString(16)).slice(-8)}
function fmt(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB'}
function say(id,m,c){var e=$(id);e.textContent=m;e.className='st '+(c||'')}
function log(m){var e=$('log');e.textContent=new Date().toTimeString().slice(0,8)+'  '+m+'\n'+e.textContent}
function api(p,post){return fetch(p,{method:post?'POST':'GET',cache:'no-store'}).then(function(r){return r.json()})}
function reg(a,d){return api('/api/reg?addr='+a+'&data='+d,1).then(function(r){log('reg 0x'+a+' = 0x'+d+(r.ok?' OK':' FAILED: '+r.error))}).catch(function(){log('board not reachable')})}
function pHex(s){s=s.trim().replace(/^0x/i,'');return /^[0-9a-fA-F]{1,8}$/.test(s)?parseInt(s,16)>>>0:-1}

/* ---- status ---- */
function chip(id,n,f){var e=$(id);e.textContent=n+(f.ok?' ✓ '+fmt(f.size):' ✗');e.className='chip'+(f.ok?' good':'')}
function refresh(){
  if(busy)return;
  api('/api/status').then(function(s){
    last=s.last;chip('cW','Weights',s.weight);chip('cP','Padding',s.padding);chip('cI','Image',s.image);
    $('cB').textContent='board online · AI '+(s.ai?'ON':'OFF')+(s.paused?' · FPGA paused':'');$('cB').className='chip good';
  }).catch(function(){$('cB').textContent='board offline';$('cB').className='chip bad'});
}

/* ---- upload ---- */
var T=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=T[(c^b[i])&255]^(c>>>8);return hex8((c^0xFFFFFFFF)>>>0)}
$('tgt').onchange=function(){var c=this.value==='';$('addr').readOnly=!c;if(!c)$('addr').value=this.value};
function pick(f){file=f||null;$('bar').hidden=true;if(!file){$('go').disabled=true;return}
  $('fname').textContent=file.name+'  ('+fmt(file.size)+')';$('go').disabled=file.size===0;say('ust',file.size?'':'The file is empty.',file.size?'':'err')}
$('file').onchange=function(){pick(this.files[0])};
['dragenter','dragover'].forEach(function(e){$('drop').addEventListener(e,function(v){v.preventDefault();$('drop').classList.add('over')})});
['dragleave','drop'].forEach(function(e){$('drop').addEventListener(e,function(v){v.preventDefault();$('drop').classList.remove('over')})});
$('drop').addEventListener('drop',function(v){pick(v.dataTransfer.files[0])});

$('go').onclick=function(){
  if(!file)return;
  var a=pHex($('addr').value);
  if(a<0x01000000){say('ust','Address must be hex and 0x01000000 or higher.','err');return}
  if(a+file.size>MAXA){say('ust','The file does not fit in DDR at that address.','err');return}
  var q='addr='+hex8(a)+'&name='+encodeURIComponent(file.name);
  busy=true;$('go').disabled=true;
  var prep=$('crc').checked?(say('ust','Computing CRC32...'),new Promise(function(r){setTimeout(r,30)}).then(function(){return file.arrayBuffer()}).then(function(b){q+='&crc='+crc32(new Uint8Array(b))})):Promise.resolve();
  prep.then(function(){
    var x=new XMLHttpRequest(),t0=Date.now();
    x.open('POST','/upload?'+q);x.setRequestHeader('Content-Type','application/octet-stream');
    $('bar').hidden=false;$('bar').value=0;
    x.upload.onprogress=function(e){if(!e.lengthComputable)return;$('bar').value=e.loaded*100/e.total;
      say('ust','Sending '+fmt(e.loaded)+' of '+fmt(e.total)+' ('+(e.loaded/1024/((Date.now()-t0)/1000||1)).toFixed(0)+' KB/s)')};
    x.onload=function(){var r={};try{r=JSON.parse(x.responseText)}catch(e){}
      var s=((Date.now()-t0)/1000).toFixed(1);
      if(x.status===200&&r.ok){say('ust','Stored '+fmt(file.size)+' at 0x'+hex8(a)+' in '+s+' s (CRC: '+r.crc+').','ok');log('upload '+file.name+' -> 0x'+hex8(a)+' OK')}
      else{var m=r.error||('HTTP '+x.status);if(r.expected)m+=' (expected '+r.expected+', got '+r.got+')';say('ust','Upload failed: '+m,'err');log('upload FAILED: '+m)}
      busy=false;$('go').disabled=false;refresh()};
    x.onerror=x.ontimeout=function(){say('ust','Connection lost. Check the board and try again.','err');busy=false;$('go').disabled=false};
    x.send(file);
  });
};

/* ---- AI ---- */
function ai(v){api('/api/ai?run='+v,1).then(function(r){log('AI '+(r.ok?(v?'ON: 0x21001000 is held at 1':'OFF: 0x21001000 cleared to 0'):'FAILED: '+r.error));refresh()}).catch(function(){log('board not reachable')})}
$('runai').onclick=function(){ai(1)};
$('clr').onclick=function(){ai(0)};


/* ---- VPU ---- */
var M=['000007FC','00000FFC','000013FC'];
function level(){reg('21000038',hex8(Math.floor($('lv').value*2.55)))}
function mode(){var m=+document.querySelector('input[name=vm]:checked').value;$('lv').disabled=(m===0);
  reg('21000018',M[m]).then(function(){if(m)level()})}
Array.prototype.forEach.call(document.getElementsByName('vm'),function(r){r.onchange=mode});
$('lv').oninput=function(){$('lvv').textContent=this.value};
$('lv').onchange=level;
$('rr').onclick=function(){var a=pHex($('ra').value);if(a<0){$('regs').textContent='Bad address.';return}
  api('/api/mem?addr='+hex8(a)+'&words='+(parseInt($('rw').value)||4)).then(function(r){
    if(!r.ok){$('regs').textContent='Error: '+r.error;return}
    var o='',base=parseInt(r.addr,16);r.words.forEach(function(w,i){o+=hex8(base+i*4)+': '+w+'\n'});$('regs').textContent=o}).catch(function(){$('regs').textContent='Board not reachable.'})};

/* ---- snapshot ---- */
function h2f(h){var s=(h&0x8000)?-1:1,e=(h>>10)&31,m=h&1023;if(e===0)return s*m*5.960464477539063e-8;if(e===31)return m?0:s*65504;return s*Math.pow(2,e-15)*(1+m/1024)}
$('snap').onclick=function(){
  var W=416,H=256,N=W*H*8,CH=32768,out=new Uint8Array(N),pos=0,t0=Date.now();
  $('snap').disabled=true;busy=true;say('sst','Pausing the FPGA...');
  api('/api/pause?on=1',1).then(function(r){
    if(!r.ok)throw new Error('pause failed: '+r.error);
    function next(){
      if(pos>=N)return;
      var n=Math.min(CH,N-pos);
      say('sst','Reading '+fmt(pos)+' of '+fmt(N)+'...');
      return fetch('/ddr?addr='+hex8(0x09000000+pos)+'&len='+n,{cache:'no-store'}).then(function(x){
        if(!x.ok)throw new Error('HTTP '+x.status+' at offset '+pos);return x.arrayBuffer()}).then(function(b){
        if(b.byteLength!==n)throw new Error('got '+b.byteLength+' of '+n+' bytes at offset '+pos);
        out.set(new Uint8Array(b),pos);pos+=n;return next()});
    }
    return next();
  }).then(function(){
    var nz=false,i;for(i=0;i<N;i++){if(out[i]){nz=true;break}}
    var u=new Uint16Array(out.buffer),ctx=$('cv').getContext('2d'),im=ctx.createImageData(W,H),d=im.data;
    for(i=0;i<W*H;i++){for(var c=0;c<3;c++){var v=h2f(u[i*4+c])*255;d[i*4+c]=v<0?0:v>255?255:v}d[i*4+3]=255}
    ctx.putImageData(im,0,0);
    var s=((Date.now()-t0)/1000).toFixed(1);
    if(nz){say('sst','Snapshot done in '+s+' s.','ok');log('snapshot OK')}
    else{say('sst','Read OK in '+s+' s, but every byte at 0x09000000 is zero: nothing has been written there yet.','err');log('snapshot: all zero')}
  }).catch(function(e){say('sst','Snapshot failed: '+e.message,'err');log('snapshot FAILED: '+e.message)})
  .then(function(){return api('/api/pause?on=0',1).catch(function(){})})
  .then(function(){busy=false;$('snap').disabled=false;refresh()});
};

/* ---- DDR memory ---- */
function show(){
  var a=pHex($('ma').value),n=Math.min(4096,Math.max(1,parseInt($('ml').value)||256));
  if(a<0||a+n>MAXA){say('mst','Bad address or range.','err');return}
  $('ml').value=n;say('mst','Reading...');
  fetch('/ddr?addr='+hex8(a)+'&len='+n,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer()}).then(function(buf){
    var b=new Uint8Array(buf),o='';
    for(var i=0;i<b.length;i+=16){var h='',t='';for(var j=0;j<16;j++){if(i+j<b.length){var v=b[i+j];h+=('0'+v.toString(16)).slice(-2)+' ';t+=(v>=32&&v<127)?String.fromCharCode(v):'.'}else h+='   '}
      o+=hex8(a+i)+'  '+h+' '+t+'\n'}
    $('hex').textContent=o||'(no data)';say('mst','Read '+b.length+' bytes from 0x'+hex8(a)+'.','ok')
  }).catch(function(e){say('mst','Read failed: '+e.message,'err')})}
$('mshow').onclick=show;
$('mnext').onclick=function(){var a=pHex($('ma').value);if(a<0)return;$('ma').value=hex8(a+(parseInt($('ml').value)||256));show()};
$('mprev').onclick=function(){var a=pHex($('ma').value);if(a<0)return;$('ma').value=hex8(Math.max(0,a-(parseInt($('ml').value)||256)));show()};
Array.prototype.forEach.call(document.querySelectorAll('button[data-a]'),function(b){b.onclick=function(){$('ma').value=b.getAttribute('data-a');show()}});
$('mdl').onclick=function(){
  if(!last||!last.size){say('mst','No upload yet.','err');return}
  say('mst','Downloading '+fmt(last.size)+'...');
  fetch('/ddr?addr='+last.addr+'&len='+last.size,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.blob()}).then(function(bl){
    var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=last.name||'ddr.bin';document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},5000);say('mst','Downloaded '+fmt(bl.size)+'.','ok')
  }).catch(function(e){say('mst','Download failed: '+e.message,'err')})};

refresh();setInterval(refresh,3000);
})();
</script>
